# Deployment configuration for this gateway: Amazon Bedrock only.
# Models are listed in config/default-config-<region>.yaml and merged in by deploy.sh.
# Bedrock guardrails are injected by deploy.sh from BEDROCK_GUARDRAIL_ID / BEDROCK_GUARDRAIL_VERSION in .env.

model_list: []

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  enable_pre_call_checks: true

environment_variables:
  STORE_MODEL_IN_DB: 'True'

litellm_settings:
  # Claude 5 and Fable reject temperature/top_p other than the default; drop such parameters instead of failing
  drop_params: true
  cache: True
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  # Ceiling for the whole proxy (all keys together) per budget_duration; per-key windows are set on each key
  max_budget: 3000.0
  budget_duration: 30d
  # Full request/response audit trail in the encrypted log bucket created by litellm-s3-log-bucket-terraform
  success_callback: ["s3"]
  failure_callback: ["s3"]
  s3_callback_params:
    s3_bucket_name:
    s3_region_name:
  redact_messages_in_exceptions: true

general_settings:
  store_prompts_in_spend_logs: false
